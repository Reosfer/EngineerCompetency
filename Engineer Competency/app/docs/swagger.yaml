host: localhost:8080
info:
  contact: {}
  description: API Gateway Internal Auth Service dengan OAuth, wallet, dan invoice.
  title: Engineer Competency API
  version: "1.0"
paths:
  /api/v1/invoice/{id}:
    get:
      consumes:
      - application/json
      description: Get invoice details by invoice ID
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - BearerAuth: []
      summary: Get invoice by ID
      tags:
      - Invoice
  /api/v1/invoice/all:
    get:
      consumes:
      - application/json
      description: Get list of all invoices
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - BearerAuth: []
      summary: Get all invoices
      tags:
      - Invoice
  /api/v1/invoice/create:
    post:
      consumes:
      - application/json
      description: Create a new invoice for a merchant
      parameters:
      - description: Invoice create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.InvoiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - BearerAuth: []
      summary: Create invoice
      tags:
      - Invoice
  /api/v1/invoice/update-status:
    put:
      consumes:
      - application/json
      description: Update invoice fields such as status and payment type
      parameters:
      - description: Invoice update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.InvoiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - BearerAuth: []
      summary: Update invoice status
      tags:
      - Invoice
  /api/v1/oauth/token:
    post:
      consumes:
      - application/json
      description: Generate OAuth access token using client credentials and password
      parameters:
      - description: OAuth token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Response'
      security:
      - BasicAuth: []
      summary: Generate OAuth token
      tags:
      - OAuth
  /api/v1/oauth/verify-login-token:
    post:
      consumes:
      - application/json
      description: Verify and validate an existing login token
      parameters:
      - description: Login token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.Response'
        "500":
